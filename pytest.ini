[tool:pytest]
# pytest configuration for Snowflake Vector Store tests
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    vectorstore: Vector store implementation tests
    task_management: Task management specific tests
    integration: Integration tests with external systems
    performance: Performance benchmarking tests
    security: Security and compliance tests
    slow: Slow running tests (mark with @pytest.mark.slow)
    requires_snowflake: Tests that require actual Snowflake connection

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --durations=10
    --color=yes

# Test discovery
collect_ignore = [
    "setup.py",
    "conftest.py"
]

# Environment variables for testing
env =
    SNOWFLAKE_ACCOUNT = test_account
    SNOWFLAKE_USER = test_user
    SNOWFLAKE_PASSWORD = test_password
    SNOWFLAKE_WAREHOUSE = test_warehouse
    SNOWFLAKE_DATABASE = test_database
    SNOWFLAKE_SCHEMA = test_schema

# Test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning