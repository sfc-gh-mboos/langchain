[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=snowflake_vectorstore
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=80
    --asyncio-mode=auto
    --durations=10
    --maxfail=5
    -p no:warnings

markers =
    unit: Unit tests
    integration: Integration tests  
    performance: Performance tests
    scenario: Real-world scenario tests
    slow: Slow running tests
    requires_snowflake: Tests requiring Snowflake connection
    requires_embeddings: Tests requiring embedding models
    task_management: Task management specific tests
    security: Security and compliance tests
    error_handling: Error handling tests
    
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    
asyncio_mode = auto
timeout = 300

# Test environment configuration
env = 
    SNOWFLAKE_ACCOUNT = test_account
    SNOWFLAKE_USER = test_user
    SNOWFLAKE_PASSWORD = test_password
    SNOWFLAKE_WAREHOUSE = test_warehouse
    SNOWFLAKE_DATABASE = test_database
    SNOWFLAKE_SCHEMA = test_schema
    PYTHONPATH = .

# Parallel execution settings
-n auto
--dist loadgroup
--maxprocesses 4